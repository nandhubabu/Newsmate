name: NewsMate CI / Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Syntax & Health Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify JavaScript syntax
        run: |
          node -c server.js
          node -c chatbot.js
          node -c simple-scraper.js

      - name: Verify Server Engine Startup & Endpoint Health
        run: |
          node -e "
          process.env.PORT = '3001';
          const axios = require('axios');
          require('./server');
          setTimeout(async () => {
            try {
              const res = await axios.get('http://localhost:3001/api/health');
              console.log('✅ Server Health Check Passed:', res.data.name, res.data.version);
              process.exit(0);
            } catch(err) {
              console.error('❌ Health check failed:', err.message);
              process.exit(1);
            }
          }, 2000);
          "
