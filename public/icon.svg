<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b66" />
      <stop offset="100%" stop-color="#ff4742" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#232938" stroke-width="4" />
  
  <!-- Masthead Newspaper Icon Body -->
  <rect x="110" y="120" width="292" height="272" rx="18" fill="#141926" stroke="#333c52" stroke-width="6" />
  
  <!-- Masthead Header Bar -->
  <rect x="136" y="152" width="160" height="28" rx="6" fill="url(#coralGrad)" />
  <circle cx="370" cy="166" r="14" fill="url(#goldGrad)" />
  
  <!-- Editorial Article Blocks -->
  <rect x="136" y="206" width="140" height="88" rx="8" fill="#202738" />
  <rect x="296" y="206" width="80" height="12" rx="4" fill="#94a3b8" />
  <rect x="296" y="232" width="80" height="12" rx="4" fill="#64748b" />
  <rect x="296" y="258" width="60" height="12" rx="4" fill="#475569" />
  <rect x="296" y="282" width="70" height="12" rx="4" fill="#475569" />
  
  <!-- Lower Telegraph Rows -->
  <rect x="136" y="320" width="240" height="12" rx="4" fill="#64748b" />
  <rect x="136" y="344" width="190" height="12" rx="4" fill="#475569" />
  
  <!-- Telemetry Live Signal Pulse Dot -->
  <circle cx="430" cy="82" r="12" fill="#ff4742" />
</svg>
